openapi: 3.1.0
info:
  title: SaaS Starter API
  version: 0.1.0
  description: Core API contract for the SaaS Starter.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API health
      tags: [system]
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: API is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check API readiness
      tags: [system]
      responses:
        '200':
          description: API dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current verified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Missing or invalid internal credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/health:
    get:
      operationId: getAdminHealth
      summary: Check administrator API access
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Administrator access granted }
        '401': { description: Missing or invalid credential }
        '403': { description: Administrator role required }
  /v1/admin/users:
    get:
      operationId: listAdminUsers
      summary: List recent users for administrators
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401':
          description: Missing or invalid internal credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unable to load user directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/users/{userId}:
    patch:
      operationId: updateAdminUserStatus
      summary: Disable or restore a user account
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AdminUser'
        '400':
          description: Invalid status payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid internal credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required or self-status change forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cannot disable the last active administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unable to update user status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      summary: List recent administrative audit events
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '401':
          description: Missing or invalid internal credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unable to load audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/settings:
    get:
      operationId: getAdminSettings
      summary: Get non-secret runtime settings for administrators
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Runtime settings snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettingsResponse'
        '401':
          description: Missing or invalid internal credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tasks:
    get:
      operationId: listTasks
      summary: List the current user's tasks
      tags: [tasks]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user's tasks
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '401':
          description: Missing or invalid credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createTask
      summary: Create a task for the current user
      tags: [tasks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Invalid task title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tasks/{taskId}:
    patch:
      operationId: updateTask
      summary: Update completion state for the current user's task
      tags: [tasks]
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed:
                  type: boolean
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Invalid completion state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteTask
      summary: Delete the current user's task
      tags: [tasks]
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204': { description: Task deleted }
        '401':
          description: Missing or invalid credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CurrentUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [user, admin] }
    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AdminUser:
      type: object
      required: [id, name, email, role, emailVerified, disabled, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        emailVerified: { type: boolean }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    AuditLogList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEvent'
    AuditLogEvent:
      type: object
      required: [id, actorUserId, actorName, actorEmail, action, resourceType, resourceId, metadata, requestId, createdAt]
      properties:
        id: { type: string }
        actorUserId: { type: string }
        actorName: { type: string }
        actorEmail: { type: string }
        action:
          type: string
          enum: [user.disable, user.restore]
        resourceType:
          type: string
          enum: [user]
        resourceId: { type: string }
        metadata:
          type: object
          additionalProperties: true
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
    AdminSettingsResponse:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: '#/components/schemas/AdminSettings'
    AdminSettings:
      type: object
      required: [appEnv, apiPort, issuerURL, audience, databaseConfigured]
      properties:
        appEnv:
          type: string
          enum: [development, test, production]
        apiPort: { type: string }
        issuerURL: { type: string, format: uri }
        audience: { type: string }
        databaseConfigured: { type: boolean }
    Task:
      type: object
      required: [id, title, completed, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 200 }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: api
    ReadyResponse:
      type: object
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: api
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            database: ok
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          example: INTERNAL_ERROR
        message:
          type: string
          example: Internal server error
        requestId:
          type: string
          example: 0f1e2d3c4b5a6978
