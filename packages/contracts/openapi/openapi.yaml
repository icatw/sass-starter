openapi: 3.1.0
info:
  title: SaaS Starter API
  version: 0.1.0
  description: Core API contract for the SaaS Starter.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API health
      tags: [system]
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: API is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current verified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Missing or invalid internal credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/health:
    get:
      operationId: getAdminHealth
      summary: Check administrator API access
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Administrator access granted }
        '401': { description: Missing or invalid credential }
        '403': { description: Administrator role required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CurrentUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [user, admin] }
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: api
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INTERNAL_ERROR
        message:
          type: string
          example: Internal server error
